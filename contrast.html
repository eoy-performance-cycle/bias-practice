<script>window.C = {"bias": "Contrast Bias", "title": "Role or comparison?", "num": "3 of 4", "intro": "Read each review comment. Decide whether it measures against the role or against a colleague, then justify your answer.", "labels": ["Role standard", "Comparison"], "items": [{"who": "Ziad, Operations Coordinator", "text": "After reviewing Yasmin, our top performer, Ziad’s work looks fairly average.", "answer": 1, "why": "Ziad is being measured against Yasmin, not against what his role requires."}, {"who": "Hadi, Logistics Specialist", "text": "Against the role’s expectation of 95% on-time delivery, Hadi delivered 97% this year.", "answer": 0, "why": "The rating is anchored to the role’s defined expectation, not to a colleague."}, {"who": "Dana, Customer Care Lead", "text": "Compared with the rest of the team, Dana seems a little less organised.", "answer": 1, "why": "A comparison with the team replaces the role standard. What does the role actually expect?"}], "fix": "Ziad", "fixPrompt": "Rewrite the comment about Ziad so it measures against the role. What would you need to know?", "fixHint": "For example: Ziad met the role’s turnaround target of 48 hours on 92% of requests.", "key": "contrast", "reflect": "am I comparing this person to the job standard, or to a colleague?", "others": [["halo.html", "Halo Effect", "Halo or evidence?", "1"], ["similarity.html", "Similarity Bias", "Results or rapport?", "2"], ["recency.html", "Recency Bias", "Whole year or last month?", "4"]]};</script>
