<script>window.C = {"bias": "Halo Effect", "title": "Halo or evidence?", "num": "1 of 4", "intro": "Read each review comment. Decide whether it rests on evidence or on a halo, then justify your answer.", "labels": ["Evidence", "Halo"], "items": [{"who": "Rania, Marketing Specialist", "text": "Rania is our best presenter, so I have rated her highly on planning and budgeting too.", "answer": 1, "why": "Presenting well says nothing about planning or budgeting. Each competency needs its own evidence."}, {"who": "Omar, Procurement Analyst", "text": "Omar closed 11 of 12 supplier contracts on time and reduced costs by 6%, so I rated his delivery highly.", "answer": 0, "why": "The rating is tied to specific, measurable results in the area being rated."}, {"who": "Faisal, Account Manager", "text": "Everyone loves working with Faisal. His overall rating should be at the top of the scale.", "answer": 1, "why": "Being well liked is real, but it is an impression, not evidence of overall performance."}], "fix": "Faisal", "fixPrompt": "Rewrite the comment about Faisal so it rests on evidence. What would you need to know?", "fixHint": "For example: Faisal met 9 of 10 client targets this year and resolved escalations within two days.", "key": "halo", "reflect": "am I rating actual performance in each area, or my overall impression of this person?", "others": [["similarity.html", "Similarity Bias", "Results or rapport?", "2"], ["contrast.html", "Contrast Bias", "Role or comparison?", "3"], ["recency.html", "Recency Bias", "Whole year or last month?", "4"]]};</script>
